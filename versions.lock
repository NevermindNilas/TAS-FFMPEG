GNUTLS_URL=https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.10.tar.xz|https://mirrors.dotsrc.org/gcrypt/gnutls/v3.8/gnutls-3.8.10.tar.xz
GNUTLS_SHA256=db7fab7cce791e7727ebbef2334301c821d79a550ec55c9ef096b610b03eb6b7

