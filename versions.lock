# ===========================================================================
# TLS -- LINUX ONLY (Windows uses Schannel, macOS SecureTransport)
# ===========================================================================
# READ THIS BEFORE "SIMPLIFYING" TO LibreSSL OR OpenSSL.
#
# ffmpeg-8.1.2/configure hard-rejects every other backend in a GPL build:
#   :7382-7383  libtls  -> die "ERROR: LibreSSL is incompatible with the gpl"
#   :7493       openssl >= 3.0 -> die "requires --enable-version3"
#   :7494       openssl <  3.0 -> die "is incompatible with the gpl"
#   :2007-2016  mbedtls is in EXTERNAL_LIBRARY_VERSION3_LIST -> forces GPLv3
# GnuTLS is the ONLY remaining option: configure:7231 gates it on nothing but
# pkg-config, and it is in neither the version3 nor the nonfree list.
#
# WHY WE NEED TLS AT ALL: Theanimescripter/src/ytdlp.py:184,202 point yt-dlp
# at OUR ffmpeg via "ffmpeg_location", and TAS sets neither --downloader nor
# hls_prefer_native, so yt-dlp's FFmpegFD fallback spawns our ffmpeg with an
# https://...m3u8 URL for live formats. See flags/ffmpeg.linux.flags.
#
# All three are built STATIC from source, not taken from the manylinux image,
# so libavformat.so acquires no new runtime .so dependency (verify-output.sh's
# import allowlist enforces that).
#
# LICENCE CHAIN: gnutls LGPL-2.1-or-later; libtasn1 and libunistring are
# vendored via --with-included-*; gmp and nettle are dual LGPLv3+/GPLv2+ and
# we take the GPLv2+ arm, which keeps the output at GPL-2.0-or-later and does
# NOT drag in the version3 problem --enable-version3 would.
#
# These are tarballs, not git: gmp is on Mercurial upstream and the GnuTLS
# and Nettle projects publish signed release tarballs as the canonical
# artefact. Pinned by SHA256, all three VERIFIED by downloading and hashing
# locally on 2026-08-04.
GMP_VERSION=6.3.0
# ftp.gnu.org FIRST: gmplib.org was unreachable from every GitHub runner on
# the first full CI run and took out three build legs at once. The GNU
# mirror was verified to serve a byte-identical tarball (same SHA256).
GMP_URL=https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz|https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz
GMP_SHA256=a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898

NETTLE_VERSION=3.10.2
NETTLE_URL=https://ftp.gnu.org/gnu/nettle/nettle-3.10.2.tar.gz
NETTLE_SHA256=fe9ff51cb1f2abb5e65a6b8c10a92da0ab5ab6eaf26e7fc2b675c45f1fb519b5

# configure:7231 has no version floor; 3.8.x is the current stable series.
